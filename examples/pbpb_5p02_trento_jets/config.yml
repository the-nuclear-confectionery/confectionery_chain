# Pb+Pb @ sqrt(s_NN) = 5.02 TeV — TRENTo + CCAKE with dijets sampled from the
# TRENTo binary-collision geometry.
# TRENTo (entropy + ncoll) -> CCAKE (2+1D + BBMG jets) -> BQSSampler -> SMASH decays -> Q-vectors
#
# The jets_sampling stage runs utils/sample_dijets on THIS event's TRENTo
# binary collisions (ncoll_list0.dat), samples back-to-back PYTHIA dijets at
# those vertices, free-streams them to tau_hydro, and points CCAKE's
# hydro.jets input_mode 'file' at them. hydro.jets.type BBMG then evolves the
# jets and hydro.source (type jet) deposits their energy loss back into the fluid.
#
# vertex_source 'trento' REQUIRES the TRENTo IC to run with ncoll: true (so the
# ncoll_list0.dat binary-collision list exists).
#
# Replace the three <REPLACE:...> paths, then:
#   python wrapper/main.py 0 pbpb_5p02.db examples/pbpb_5p02_trento_jets/config.yml
global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 10.0
    step_x: 0.1
    step_y: 0.1
    step_eta: 0.0     # zero -> (2+1)D boost-invariant hydro
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 0.6
  ion_A: Pb
  ion_B: Pb

input:
  initial_conditions:
    type: Trento
    parameters:
      ion_A: {species: Pb}
      ion_B: {species: Pb}
      nucleon-width: 0.5
      constit-width: 0.5
      centrality-min: 0.0
      centrality-max: 5.0
      ncoll: true             # REQUIRED for jet vertex sampling -> writes ncoll_list0.dat

  overlay:
    type: none

  preequilibrium:
    type: none

  hydrodynamics:
    type: CCAKE
    initial_conditions:
      input_as_entropy: true  # TRENTo output is entropy density
    parameters:
      dt: 0.05
      h_T: 0.3
      h_eta: 0.3
      rk_order: 2
      energy_cutoff: 0.15
      max_tau: 15.0
    jets_sampling:
      enabled: true
      n_dijets: 1
      pt_min: 100.0           # PYTHIA pT-hat window (must be < sqrt(s)/2 = 2510 GeV)
      pt_max: 200.0
      vertex_source: trento   # sample dijet vertices from TRENTo binary collisions
      # tau: 0.6              # defaults to global.tau_hydro
    hydro:
      baryon_charge_enabled: false
      strange_charge_enabled: false
      electric_charge_enabled: false
      jets:
        type: BBMG            # jets_sampling sets input_mode:file + input_file automatically
        Energy_scaling: 0     # BBMG 'a'
        Path_Length_scaling: 1  # BBMG 'z'
        Fluctuation_parameter: 0  # BBMG 'q'
      source:
        type: jet             # feed the jet energy loss back into the fluid
        model: BBMG
        smearing_radius: 0.5
        smearing_radius_eta: 0.5
      viscous_parameters:
        shear:
          mode: constant
          constant_eta_over_s: 0.12
        bulk:
          mode: cs2_dependent
          constant_zeta_over_s: 0.0
    eos:
      type: table
      online_inverter_enabled: true
      normalize_by_T: true
      restrict_mu_T_ratios: true
      prohibit_unstable_cs2: true
    particlization:
      enabled: true
      type: fixed_T
      T: 150.0
    output:
      jet_evolution: true     # dump per-step jet state (jet_state_*.dat)
      txt_evolution: false
      hdf_evolution: false
      check_causality: true

  particlization:
    type: BQSSampler
    parameters:
      mode: ccakev2
      coordinate_system: hyperbolic
      dimension: 2
      samples: 500
      sampling_method: regular
      delta_f_shear: true
      normalize_deltaf: true
      y_max: 5.0

  afterburner:
    type: smash
    parameters:
      decays_only: true

  analysis:
    type: qvector_writter
    parameters:
      n_max: 6
      calculate_charged: true
      input_type: smash_hepmc3
      output_type: root
