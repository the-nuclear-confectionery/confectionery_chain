# Au+Au 19.6 GeV sample — EXACT paper convergence values (Delta x=0.3 point).
# Bundled AMPT event -> AMPTGenesis(K=2.0) -> CCAKE(table BSQ EoS, eta/s=0.08, bulk cs2_dependent)
#   -> BQSSampler -> SMASH decays -> Q-vectors.  Reproduces the paper 19.6 GeV v_n.
#
# Runs as-is, no editing — from the repo root:
#   python wrapper/main.py 0 sample.db examples/input_sample_19p6.yml
# then:  qvector_analysis + sample_run/plot_vn.py  (see README section 6).
global:
  # 'default' = auto: basedir -> this repo, output -> <repo>/sample_output,
  # tmp -> <repo>/sample_tmp. Set an absolute path here to put them elsewhere.
  output: default
  tmp: default
  basedir: default
  nevents: 1
  grid:
    x_max: 14.0
    y_max: 14.0
    eta_max: 6.0
    step_x: 0.3           # -> 94 pts / box 27.9 (paper Delta x_x=0.3)
    step_y: 0.3
    step_eta: 0.1         # -> 121 pts / box 12 (paper Delta x_eta=0.1)
  energy:
    value: 19.6
    unit: GeV
  tau_hydro: 1.3
  ion_A: Au
  ion_B: Au

input:
  initial_conditions:
    type: none            # existing AMPT event

  overlay:
    type: AMPTGenesis
    parameters:
      paths:
        # BUNDLED paper 19.6 GeV event (AMPT_evt0008) -> reproduces the paper exactly.
        # Relative paths are resolved against basedir (the repo), so this works from
        # any directory. Replace with an absolute path to run a different AMPT event.
        input: sample_run/AMPT_evt0008/ana
        output: default
      smearing:
        sigma_r: 1.0
        sigma_eta: 1.0
        K: 2.0            # paper 19.6 normalization

  preequilibrium:
    type: none

  hydrodynamics:
    type: CCAKE
    parameters:
      dt: 0.05
      h_T: 0.3
      h_eta: 0.3
      rk_order: 2
      energy_cutoff: 0.15
      max_tau: 25.0
    hydro:
      baryon_charge_enabled: false
      strange_charge_enabled: false
      electric_charge_enabled: false
      viscous_parameters:
        shear:
          mode: constant
          constant_eta_over_s: 0.08
        bulk:
          mode: cs2_dependent
          constant_zeta_over_s: 0.08
          cs2_dependent_zeta_A: 1.67552
          cs2_dependent_zeta_p: 2.0
          modulate_with_tanh: false
        diffusion:
          mode: constant_over_T2
    eos:
      type: table
      online_inverter_enabled: true
      normalize_by_T: true
      restrict_mu_T_ratios: true
    particlization:
      enabled: true
      type: fixed_T
      T: 150.0
    output:
      txt_evolution: false
      hdf_evolution: false

  particlization:
    type: BQSSampler
    parameters:
      mode: ccakev2
      coordinate_system: hyperbolic
      dimension: 3
      use_muB: false
      use_muS: false
      use_muQ: false
      samples: 1000            # oversampling; lower = faster SMASH. Paper used 10000.
      sampling_method: regular
      force_temperature: false
      temperature: 0.150
      delta_f_shear: true
      delta_f_bulk: true
      normalize_deltaf: true
      y_max: 5.0
      seed: 20240808

  afterburner:
    type: smash
    parameters:
      decays_only: true
      Output:
        Particles:
          Format: ["HepMC_treeroot"]

  analysis:
    type: qvector_writter
    parameters:
      n_max: 6
      calculate_charged: true
      pids: [-211, 211, 321, -321, 2212, -2212]
      pt_bins: 120
      max_pt: 6.0
      eta_bins: 108
      max_eta: 5.4
      input_type: smash_hepmc3
      output_type: root
