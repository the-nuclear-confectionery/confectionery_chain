# T1 smoke config for the jet-sampling path: auau_tiny plus one sampled dijet
# fed into CCAKE via hydro.jets input_mode 'file'.
global:
  output: __OUTPUT__
  tmp: __TMP__
  basedir: __BASEDIR__
  nevents: 1
  grid:
    x_max: 14.0     # room for radial outflow (see auau_tiny)
    y_max: 14.0
    eta_max: 4.0
    step_x: 0.3
    step_y: 0.3
    step_eta: 0.3
  energy:
    value: 19.6
    unit: GeV
  tau_hydro: 1.0
  ion_A: Au
  ion_B: Au

input:
  initial_conditions:
    type: ampt
    parameters:
      ion_A: {species: Au}
      ion_B: {species: Au}
      BMIN: 0.0
      BMAX: 3.3
      alpha: 0.47140452 # 3 mb parton cross section (paired with screening mass), per bes/19p6
      parton_screening_mass: 3.2264
      hijing_seed: 20260708
      parton_cascade_seed: 8

  overlay:
    type: AMPTGenesis
    parameters:
      smearing:
        sigma_r: 1.0     # AMPTGenesis standard; <1.0 gives a spiky, under-smeared IC
        sigma_eta: 1.0
        K: 1.44          # 19.6 GeV normalization; K~1.0 under-energizes -> premature freeze-out

  preequilibrium:
    type: none

  hydrodynamics:
    type: CCAKE
    parameters:
      dt: 0.05
      h_T: 0.3
      h_eta: 0.3
      factorized_kernel: true
      energy_cutoff: 0.15
      max_tau: 20.0
      buffer_particles:
        enabled: true
        circular: true
        padding_thickness: 0.1
    jets_sampling:
      enabled: true
      n_dijets: 1
      pt_min: 4.0        # pT-hat window must fit inside sqrt(s)/2
      pt_max: 8.0
      vertex_source: binary
    hydro:
      baryon_charge_enabled: true
      strange_charge_enabled: false
      electric_charge_enabled: false
      jets:
        type: BBMG        # jets_sampling sets input_mode: file automatically
        Energy_scaling: 0
        Path_Length_scaling: 1
        Fluctuation_parameter: 0
      source:
        type: jet         # deposit the jet energy loss back into the fluid
        model: BBMG
        smearing_radius: 0.5
      viscous_parameters:
        shear:
          mode: constant
          constant_eta_over_s: 0.08
        bulk:
          mode: cs2_dependent
          constant_zeta_over_s: 0.08
          modulate_with_tanh: false
        diffusion:
          mode: disabled
    eos:
      online_inverter_enabled: true
      normalize_by_T: true
      restrict_mu_T_ratios: true
      prohibit_unstable_cs2: true
    particlization:
      enabled: true
      type: fixed_T
      T: 150.0
    output:
      txt_evolution: false
      hdf_evolution: false

  particlization:
    type: BQSSampler
    parameters:
      samples: 2
      use_muB: true
      use_muS: false
      use_muQ: false
      seed: 12345

  afterburner:
    type: smash
    parameters:
      decays_only: true

  analysis:
    type: qvector_writter
    parameters:
      n_max: 6
      calculate_charged: true
      input_type: smash_hepmc3
      output_type: root
