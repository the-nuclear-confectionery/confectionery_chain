# ALL ICCING OPTIONS — exhaustive schema reference (overlay).
# Every ICCING flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  overlay:
    type: ICCING
    parameters:
      seed: random  # Seed for ICCING.
      input_type: sparse  # Sparse or full input type. | options: [sparse, full]
      output_type: sparse  # Sparse or full output type. | options: [sparse, full]
      density_profile_type: Kernel  # Density profile type. | options: [Gaussian, Kernel]
      dipole_model: GBW  # Dipole model (GBW or MV). | options: [GBW, MV]
      charge_type: BSQ  # Charge type (BSQ or UDS). | options: [BSQ, UDS]
      eccentricity_type: COM  # Eccentricity type.
      greens_evolution: 0  # Enable or disable greens evolution (0 for false, 1 for true).
      t_a: 0  # Flag to include t_a contribution (0 for false, 1 for true).
      t_b: 1  # Flag to include t_b contribution (0 for false, 1 for true).
      trento_normalization: 1  # Normalization factor for TRENTo.
      alpha_s: 0.3  # Strong coupling constant alpha_s.
      kappa: 1  # Kappa parameter in GeV.
      gluon_radius: 0.5  # Gluon radius in fm.
      quark_radius: 1.0  # Quark radius in fm.
      r_max: 1  # Maximum r value in fm.
      alpha_min: 0.01  # Minimum alpha value.
      s_chop: 1.0e-19  # Chopping threshold for s in fm^-3.
      e_thresh: 0.25  # Energy threshold in GeV/fm^3.
      lambda: 1  # Lambda parameter.
      lambda_bym: 0.001  # Lambda/m parameter.
      perturbative_regime: 0.9  # Perturbative regime parameter.
      background_points: 10146  # Number of background points.
      greens_functions_points: 128  # Number of Greens function points.
      greens_functions_chunks: 400  # Number of Greens function chunks.
      c_infinity: 0.8846609  # Value of c_infinity.
      eta_over_s: 0.047  # Viscosity over entropy ratio.
      paths:
        trento_results_directory: default  # Directory containing TRENTo results.
        EoS: default  # Path to the equation of state (EoS) file.
        background_attractor: default  # Path to the background attractor file.
        executable_directory: default  # Path to the directory containing the ICCING executable.
        greens_functions: default  # Path to the Greens functions file.
        quark_chemistry: default  # Path to the quark chemistry file.
        results_directory: default  # Directory where ICCING results will be stored.
