# ALL QVECTOR_WRITTER OPTIONS — exhaustive schema reference (analysis).
# Every QVECTOR_WRITTER flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  analysis:
    type: qvector_writter
    parameters:
      n_max: 6  # Maximum harmonic order to compute Q-vectors for.
      calculate_charged: true  # Whether to compute Q-vectors for charged particles.
      pids: [-211, 211, 321, -321, 2212, -2212, 3122, -3122, 3222, 3112, 3334]  # List of PIDs for identified particle Q-vector analysis.
      pt_bins: 120  # Number of pT bins (ignored if pt_bins_custom is given).
      max_pt: 6.0  # Maximum pT for binning.
      eta_bins: 108  # Number of eta bins (ignored if eta_bins_custom is given).
      max_eta: 5.4  # Maximum eta for binning.
      pt_bins_custom: []  # Optional custom bin edges for pT. | [no schema default]
      eta_bins_custom: []  # Optional custom bin edges for eta. | [no schema default]
      input_type: default  # Input format to be parsed. | options: [smash_hepmc3, smash_oscar, afterdecays, default, oscar_sampler, iss_oscar]
      output_type: root  # Format of output files. | options: [text, root]
