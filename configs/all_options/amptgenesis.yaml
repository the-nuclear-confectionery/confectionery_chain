# ALL AMPTGenesis OPTIONS — exhaustive schema reference (overlay).
# Every AMPTGenesis flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  overlay:
    type: AMPTGenesis
    parameters:
      paths:
        input: default  # Path to the input directory.
        output: default  # Path to the output directory.
      smearing:
        sigma_r: 0.6  # Smearing parameter for radial direction in fm.
        sigma_eta: 0.6  # Smearing parameter for eta direction.
        K: 2.0  # Normalization factor for smearing.
        backpropagate: false  # If true, partons that form after tau0 are free-streamed backward onto the tau0 surface (energy-conserving); if false they are dropped.
      sample_radius:
        xy: 2.0  # Deposition scan radius in the transverse plane, in multiples of sigma_r.
        eta: 2.0  # Deposition scan radius in eta, in multiples of sigma_eta.
      energy_density_cutoff: 0.15  # Minimum energy density (GeV/fm^3) for a cell to be written to the IC. Defaults to the CCAKE energy_cutoff when omitted.
