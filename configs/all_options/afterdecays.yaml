# ALL AFTERDECAYS OPTIONS — exhaustive schema reference (afterburner).
# Every AFTERDECAYS flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  afterburner:
    type: afterdecays
    parameters:
      keep_result: false  # If true, persist the decayed spectra output (output.dat) to the top-level output dir so it survives end-of-run cleanup.
      path_to_pT_range: default  # Path to pT grid/basis file (e.g., gl15.dat).
      path_to_phi_range: default  # Path to phi grid/basis file (e.g., gq20.dat).
      path_to_spectra: default  # Path to input spectra table (e.g., evv2_dNdphidpp.dat).
      path_to_resonances: default  # Path to resonance list (e.g., resoweakPDG2016Plus.dat).
      path_to_output: default  # Output directory for the decayed spectra.
      use_corrected: false  # Use corrected spectra if true; otherwise, use uncorrected.
