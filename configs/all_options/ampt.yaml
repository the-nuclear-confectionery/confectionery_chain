# ALL AMPT OPTIONS — exhaustive schema reference (initial condition).
# Every AMPT flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  initial_conditions:
    type: ampt
    parameters:
      ion_A:
        species: p  # Species of the first ion (e.g., Pb, Au). | options: [p, d, Cu, Zr, Ru, Xe, Au, Pb, U] | [no schema default]
      ion_B:
        species: p  # Species of the second ion (e.g., Pb, Au). | options: [p, d, Cu, Zr, Ru, Xe, Au, Pb, U] | [no schema default]
      EFRM: 19.6  # sqrt(S_NN) in GeV if FRAME is CMS. NOTE: taken as-is (not derived from global.energy); default matches the bes/19p6 Au+Au card.
      FRAME: CMS  # Collision frame. | options: [CMS]
      PROJ: A  # Projectile.
      TARG: A  # Target.
      IAP: 197  # Projectile A number (default 197 = Au, bes/19p6 card).
      IZP: 79  # Projectile Z number (default 79 = Au, bes/19p6 card).
      IAT: 197  # Target A number (default 197 = Au, bes/19p6 card).
      IZT: 79  # Target Z number (default 79 = Au, bes/19p6 card).
      NEVNT: 1  # Total number of events.
      BMIN: 0.0  # Minimum impact parameter in fm.
      BMAX: 25.6  # Maximum impact parameter in fm (25.60 = Au+Au upper limit HIPR1(34)+HIPR1(35), bes/19p6 card).
      ISOFT: 4  # Select Default AMPT or String Melting.
      NTMAX: 150  # Number of timesteps.
      DT: 0.2  # Timestep in fm.
      PARJ41: 0.55  # Parameter a in Lund symmetric splitting function.
      PARJ42: 0.15  # Parameter b in Lund symmetric splitting function.
      popcorn: 1  # Flag for popcorn mechanism (1 for yes, 0 for no).
      PARJ5: 1.0  # Parameter to control baryon-antibaryon production in popcorn.
      shadowing_flag: 1  # Flag for shadowing (1 for yes, 0 for no).
      quenching_flag: 0  # Flag for quenching (0 for no, 1 for yes).
      quenching_parameter: 1.0  # Quenching parameter -dE/dx (GeV/fm) when quenching_flag=1 (bes/19p6 card).
      p0_cutoff: 2.0  # p0 cutoff in HIJING for minijet productions.
      parton_screening_mass: 3.2264  # Parton screening mass in fm^(-1). 3.2264 gives a 3 mb parton cross section when paired with alpha=0.47140452 (bes/19p6 card); the AMPT-manual 3 mb pair is 2.265 with alpha=0.33.
      IZPC: 0  # Flag for forward-angle parton scatterings.
      alpha: 0.47140452  # Alpha in parton cascade (paired with parton_screening_mass=3.2264 for 3 mb, bes/19p6 card).
      dpcoal: 1000000.0  # dpcoal in GeV.
      drcoal: 1000000.0  # drcoal in fm.
      ihjsed: 0  # HIJING seed flag (11 = generate seed at ampt runtime). Kept 0 (NOT the bes/19p6 card's 11) so the wrapper's hijing_seed becomes NSEED and drives all generators reproducibly — see docs/KNOWN_ISSUES.md #1.
      hijing_seed: random  # Accepts 'random' or an integer value as the random seed.
      parton_cascade_seed: random  # Accepts 'random' or an integer value as the random seed.
      k0s_decay_flag: 0  # Flag for K0s weak decays.
      phi_decay_flag: 1  # Flag for phi decays at end of hadron cascade.
      pi0_decay_flag: 0  # Flag for pi0 decays at end of hadron cascade.
      oscar_output: 3  # Optional OSCAR output flag.
      perturbative_deuteron_flag: 0  # Flag for perturbative deuteron calculation.
      perturbative_deuteron_factor: 1  # Integer factor for perturbative deuterons (>=1 & <=10000).
      deuteron_cross_section_choice: 1  # Choice of cross section assumptions for deuteron reactions.
      pttrig: -7.0  # Pt threshold in GeV to require at least one minijet.
      maxmiss: 1000  # Maximum number of tries to repeat a HIJING event.
      initial_final_radiation_flag: 3  # Flag on initial and final state radiation.
      kt_kick_flag: 1  # Flag on Kt kick.
      quark_pair_embedding_flag: 0  # Flag to turn on quark pair embedding.
      embedded_quark_initial_px: 7  # Initial Px value (GeV) of the embedded quark.
      embedded_quark_initial_py: 0  # Initial Py value (GeV) of the embedded quark.
      embedded_quark_initial_x: 0  # Initial x position (fm) of the embedded quark.
      embedded_quark_initial_y: 0  # Initial y position (fm) of the embedded quark.
      nsembd: 1  # Number of soft pions to be embedded.
      psembd: 5.0  # Momentum of each embedded soft pion in GeV.
      tmaxembd: 0.0  # Maximum angle (radian) for embedded soft pions.
      ishadow: 0  # Flag to enable users to modify shadowing.
      dshadow: 1.0  # Factor used to modify nuclear shadowing.
      iphirp: 0  # Flag for random orientation of reaction plane.
