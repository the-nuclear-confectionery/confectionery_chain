# ALL ANALYTICAL OPTIONS — exhaustive schema reference (particlization).
# Every ANALYTICAL flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  particlization:
    type: analytical
    parameters:
      input_file: default  # Path to analytical particlization input file.
      equations_version: v2  # options: [shear+bulk, idealBSQ, v2]
      folder: ""  # [no schema default]
      temperature: 0.15
      decays: 0  # options: [0, 1, 2, 3]
      event_range: [0, 0]
      basis_files: [default, default]  # [no schema default]
      df_correction_file: default
      ptphi_grid_file: default
      hadron_list_file: default
      hadron_check_file: default
