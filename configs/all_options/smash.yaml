# ALL SMASH OPTIONS — exhaustive schema reference (afterburner).
# Every SMASH flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  afterburner:
    type: smash
    parameters:
      decays_only: false  # If true, only decays are performed without rescattering.
      keep_result: false  # If true, persist the final post-SMASH particle list (SMASH_HepMC_particles.root) to the top-level output dir so it survives end-of-run cleanup.
      input_file: default  # Path to the input file containing freezeout surface data.
      Logging:
        default: INFO  # Logging level for the simulation. | options: [DEBUG, INFO, WARN, ERROR]
      General:
        Modus: List  # options: [List]
        Time_Step_Mode: Fixed  # options: [Fixed]
        Delta_Time: 10.0
        End_Time: 1000.0
        seed: random
        Nevents: 1
      Output:
        Output_Interval: 1000.0
        Particles:
          Format: [HepMC_treeroot]
      Collision_Term:
        No_Collisions: false
        Force_Decays_At_End: false
      Modi:
        List:
          File_Directory: ../input/list
          Filename: particle_list_osc.dat
