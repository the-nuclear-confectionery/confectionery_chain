# ALL iS3D OPTIONS — exhaustive schema reference (particlization).
# Every iS3D flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  particlization:
    type: is3d
    parameters:
      keep_result: false  # If true, persist the sampled particle list (particle_list_osc.dat) to the top-level output dir so it survives end-of-run cleanup.
      input_file: default  # Path to freezeout surface file for iS3D.
      operation: 2  # options: [0, 1, 2]
      mode: default
      hrg_eos: 2  # options: [1, 2, 3]
      set_FO_temperature: 0  # options: [0, 1]
      T_switch: 0.15
      dimension: 2  # options: [2, 3]
      df_mode: 8
      include_baryon: 1
      include_bulk_deltaf: 0
      include_shear_deltaf: 1
      include_baryondiff_deltaf: 0
      regulate_deltaf: 1
      outflow: 1
      deta_min: 1.0e-05
      group_particles: 0
      particle_diff_tolerance: 0.01
      mass_pion0: 0.18
      do_resonance_decays: 0
      lightest_particle: 111
      oversample: 1
      min_num_hadrons: 100000000.0
      max_num_samples: 1
      fast: 0
      y_cut: 5.0
      seed: random
      test_sampler: 0
      pT_lower_cut: 0.0
      pT_upper_cut: 3.0
      pT_bins: 100
      y_bins: 50
      eta_cut: 7.0
      eta_bins: 70
      tau_min: 0.0
      tau_max: 12.0
      tau_bins: 120
      r_min: 0.0
      r_max: 12.0
      r_bins: 60
