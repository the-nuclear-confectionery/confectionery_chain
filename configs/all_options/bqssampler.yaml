# ALL BQSSampler OPTIONS — exhaustive schema reference (particlization).
# Every BQSSampler flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  particlization:
    type: BQSSampler
    parameters:
      keep_result: false  # If true, persist the sampled particle list (particle_list.dat) to the top-level output dir so it survives end-of-run cleanup.
      input_file: default  # Path to freezeout surface file for BSQ sampler.
      mode: ccakev2  # options: [ccakev2, ccakev1]
      coordinate_system: hyperbolic  # options: [cartesian, hyperbolic]
      dimension: 3  # options: [2, 3]
      use_muB: false
      use_muS: false
      use_muQ: false
      force_temperature: false
      temperature: 0.15
      samples: 100
      sampling_method: regular  # options: [regular, conserved_charge]
      delta_f_shear: false
      delta_f_diffusion: false
      delta_f_bulk: false
      normalize_deltaf: false
      seed: random
      y_max: 5.0
      output_file: default
      tables_path: default
      position_smearing: 0.001
      eos_column: true  # Read EoS type flag (col 44) from freeze-out surface file; set false for old files without this column.
