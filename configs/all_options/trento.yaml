# ALL TRENTo OPTIONS — exhaustive schema reference (initial condition).
# Every TRENTo flag from wrapper/utils/schema.yml, with its default value
# and description. This is a FLAG CATALOG (schema defaults shown, not a
# physics-tuned run): copy the keys you need into a runnable chain config
# from examples/. Auto-generated by regenerate.py; validates against the schema.

global:
  output: <REPLACE:/path/for/results>
  tmp: <REPLACE:/path/for/scratch>
  basedir: <REPLACE:/path/to/test_chain>
  nevents: 1
  grid:
    x_max: 12.0
    y_max: 12.0
    eta_max: 6.0
    step_x: 0.2
    step_y: 0.2
    step_eta: 0.2     # >0 -> 3+1D, 0 -> 2+1D
  energy:
    value: 5.02
    unit: TeV
  tau_hydro: 1.0
  ion_A: Pb
  ion_B: Pb

input:
  initial_conditions:
    type: Trento
    parameters:
      keep_result: false  # If true, persist the CCAKE-format initial condition (ccake_ic.dat) to the top-level output dir so it survives end-of-run cleanup.
      ion_A:
        species: ""  # Species of the first ion. Either a built-in TRENTo species (p, d, Cu, Zr, Ru, Xe, Au, Pb, U) or a path to an HDF5 nuclear-configuration file (e.g. /projects/bbkr/kpala/nuclear_configs/O_config.hdf) read via TRENTo's ManualNucleus. | [no schema default]
      ion_B:
        species: ""  # Species of the second ion. Either a built-in TRENTo species (p, d, Cu, Zr, Ru, Xe, Au, Pb, U) or a path to an HDF5 nuclear-configuration file (e.g. /projects/bbkr/kpala/nuclear_configs/Ne_config.hdf) read via TRENTo's ManualNucleus. | [no schema default]
      fluctuation: 1.6  # Fluctuation parameter for TRENTo.
      number-events: 1  # Number of events to be simulated in TRENTo.
      entropy-dict-dir: default  # Path to the entropy dictionary directory.
      quiet: false  # Suppress output if true.
      no-header: false  # Do not write headers to output files if true.
      ncoll: false  # Flag to include binary collisions in the output.
      sparse-output: true  # Use sparse output format for generated events.
      output-format: true  # Use HDF5 or both text and HDF5 formats for output.
      reduced-thickness: 0.0  # Reduced thickness parameter in TRENTo.
      fluctuation-type: Gamma  # Fluctuation distribution type (Gamma or LogNormal). | options: [Gamma, LogNormal]
      nucleon-width: 0.3  # Gaussian nucleon width.
      nucleon-width-probability: 0.0  # Probability for nucleon width distribution.
      constit-width: 0.3  # Gaussian constituent width.
      constit-number: 1  # Number of constituents per nucleon.
      nucleon-min-dist: 0.0  # Minimum allowed distance between nucleons.
      number-nucleons: 208  # Number of nucleons per ion (assuming Pb).
      woods-saxon-radius: 5.09  # Woods-Saxon nuclear radius.
      woods-saxon-thickness: 0.46  # Woods-Saxon skin thickness.
      woods-saxon-omega: 0.0  # Woods-Saxon deformation parameter omega.
      beta2: 0.0  # Deformation parameter beta2.
      beta3: 0.0  # Deformation parameter beta3.
      beta4: 0.0  # Deformation parameter beta4.
      cross-section: 7.0  # Inelastic nucleon-nucleon cross-section in fm².
      normalization: 1.0  # Normalization factor for entropy deposition.
      b-min: 0.0  # Minimum impact parameter in fm.
      b-max: -1.0  # Maximum impact parameter (-1 means auto-detect).
      centrality-min: -10.0  # Minimum centrality percentage.
      centrality-max: -100.0  # Maximum centrality percentage.
      reduced-thickness-form: default  # To be determined
      seed: random  # Accepts 'random' or an integer value as the random seed.
